# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
  - master

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: production-secrets
  - name: buildConfiguration
    value: "Release"

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.x
            displayName: Use .NET 10

          - script: dotnet --version
            displayName: Check dotnet version

          - script: dotnet build --configuration $(buildConfiguration)
            displayName: dotnet build $(buildConfiguration)

          - task: DotNetCoreCLI@2
            displayName: Run tests with coverage
            inputs:
              command: test
              projects: "**/*Tests.csproj"
              arguments: "--configuration $(buildConfiguration) --collect:\"XPlat Code Coverage\""

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            inputs:
              summaryFileLocation: "$(Agent.TempDirectory)/**/coverage.cobertura.xml"

          - task: DotNetCoreCLI@2
            displayName: Publish app
            inputs:
              command: publish
              publishWebProjects: False
              projects: |
                **/*.csproj
                !**/*Tests.csproj
              arguments: "--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)"
              zipAfterPublish: True

          - task: PublishPipelineArtifact@1
            displayName: Publish app artifact
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: app

          - script: |
              dotnet tool install --global dotnet-ef
              LAST_MIGRATION=$(dotnet ef migrations list --project PrintLogApi \
                --connection "$(DB_CONNECTION_STRING)" \
                --prefix-output 2>/dev/null \
                | grep '^data:' | sed 's/^data: //' | grep -v '(Pending)' | tail -1 | xargs)
              echo "Last applied migration: $LAST_MIGRATION"
              dotnet ef migrations script "$LAST_MIGRATION" --project PrintLogApi \
                --output $(Build.ArtifactStagingDirectory)/migrations.sql --idempotent
            displayName: Generate migration SQL script
            env:
              DB_CONNECTION_STRING: $(DB_CONNECTION_STRING)

          - task: PublishPipelineArtifact@1
            displayName: Publish migration script for review
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/migrations.sql
              artifact: migration-script

          - script: |
              dotnet ef migrations bundle --project PrintLogApi --runtime linux-x64 \
                --output $(Build.ArtifactStagingDirectory)/efbundle
            displayName: Build migrations bundle

          - task: PublishPipelineArtifact@1
            displayName: Publish migrations bundle
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/efbundle
              artifact: migrations-bundle

  - stage: Deploy
    dependsOn: Build
    jobs:
      - job: WaitForApproval
        pool: server
        steps:
          - task: ManualValidation@1
            inputs:
              notifyUsers: csh.hoffman@gmail.com
              instructions: "Review the migration-script artifact from the Build stage before approving."
              onTimeout: reject
              timeoutInMinutes: 1440

      - job: MigrateAndDeploy
        dependsOn: WaitForApproval
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: Download migrations bundle
            inputs:
              artifact: migrations-bundle
              targetPath: $(Pipeline.Workspace)/migrations-bundle

          - task: DownloadPipelineArtifact@2
            displayName: Download app artifact
            inputs:
              artifact: app
              targetPath: $(Build.ArtifactStagingDirectory)

          - script: |
              chmod +x $(Pipeline.Workspace)/migrations-bundle/efbundle
              $(Pipeline.Workspace)/migrations-bundle/efbundle --connection "$(DB_CONNECTION_STRING)"
            displayName: Run migrations
            env:
              DB_CONNECTION_STRING: $(DB_CONNECTION_STRING)

          - task: AzureRmWebAppDeployment@4
            displayName: Deploy to Azure App Service
            inputs:
              ConnectionType: "AzureRM"
              azureSubscription: "Pay-As-You-Go(29db28c6-5b46-4b30-be91-db289749cab3)"
              appType: "webAppLinux"
              WebAppName: "3d-print-log-api-prod"
              packageForLinux: "$(Build.ArtifactStagingDirectory)/**/*.zip"
              RuntimeStack: "DOTNETCORE|10.0"
