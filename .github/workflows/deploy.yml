name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish app
        run: dotnet publish PrintLogApi/PrintLogApi.csproj --configuration Release --output ./publish

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Generate migration SQL script
        run: |
          dotnet tool install --global dotnet-ef
          MIGRATIONS_JSON=$(dotnet ef migrations list --project PrintLogApi \
            --connection "$DB_CONNECTION_STRING_MIGRATIONS_READER" \
            --json --no-build --configuration Release 2>&1) || true
          echo "Raw migrations output: $MIGRATIONS_JSON"
          LAST_MIGRATION=$(echo "$MIGRATIONS_JSON" \
            | sed -n '/^\[/,$p' \
            | jq -r '[.[] | select(.applied == true)] | last | .id // empty' \
            2>/dev/null || true)
          echo "Last applied migration: $LAST_MIGRATION"
          if [ -z "$LAST_MIGRATION" ]; then
            echo "ERROR: Could not determine last applied migration" >&2
            exit 1
          fi
          dotnet ef migrations script "$LAST_MIGRATION" --project PrintLogApi \
            --output migrations.sql --idempotent --no-build --configuration Release
        env:
          DB_CONNECTION_STRING_MIGRATIONS_READER: ${{ secrets.DB_CONNECTION_STRING_MIGRATIONS_READER }}

      - name: Upload migration script artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migrations.sql

      - name: Build migrations bundle
        run: |
          dotnet restore PrintLogApi/PrintLogApi.csproj --runtime linux-x64
          dotnet ef migrations bundle --project PrintLogApi --runtime linux-x64 \
            --output ./efbundle

      - name: Upload migrations bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: migrations-bundle
          path: ./efbundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Requires manual approval — configure required reviewers in repo Settings → Environments → production
    # Reviewers receive a GitHub notification and can review the migration-script artifact before approving
    environment: production

    steps:
      - name: Download migrations bundle
        uses: actions/download-artifact@v4
        with:
          name: migrations-bundle
          path: ./migrations-bundle

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Run migrations
        run: |
          chmod +x ./migrations-bundle/efbundle
          ./migrations-bundle/efbundle --connection "$DB_CONNECTION_STRING"
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
