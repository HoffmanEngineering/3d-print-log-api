name: Deploy

on:
  push:
    tags:
      - 'v*'

# Read-only by default, so the third-party actions in the build and deploy jobs never
# receive a token that can write to the repository. Only publish-release widens it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Same pin as ci.yml. A release must not be built with a different SDK than the one CI
          # validated the commit against.
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish app
        run: dotnet publish PrintLogApi/PrintLogApi.csproj --configuration Release --output ./publish

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: ./publish

      # Restores dotnet-ef from dotnet-tools.json, which pins it to the same version as the EF Core
      # packages. This step previously ran `dotnet tool install --global dotnet-ef`, which ignores
      # that pin and installs whatever is newest.
      #
      # That mattered more here than anywhere else in the repo: the tool restored by this job
      # generates the migration script a reviewer approves AND the efbundle that is executed against
      # the production database. A dotnet-ef newer than the app's EF Core version is exactly the
      # drift the manifest exists to prevent, in the one place where the blast radius is production
      # data. ci.yml already did this correctly; the release path did not.
      - name: Restore tools
        run: dotnet tool restore

      # Scripts from the migration *before the first unapplied one*, not from after the last
      # applied one. Applied migrations are not necessarily a prefix of the id-ordered list: a PR
      # that branches early can merge after a sibling, leaving a pending migration with a LOWER id
      # than migrations already in the database (#106 merged after #107/#108 did exactly this).
      # The old "last applied" query then picked an id past the pending one and produced an empty
      # script -- so the production approval gate showed a reviewer nothing while the efbundle,
      # which applies all pending migrations regardless of order, was about to add two columns.
      # --idempotent guards each statement, so re-including already-applied migrations in the
      # range is safe.
      - name: Generate migration SQL script
        run: |
          MIGRATIONS_JSON=$(dotnet tool run dotnet-ef migrations list --project PrintLogApi \
            --connection "$DB_CONNECTION_STRING_MIGRATIONS_READER" \
            --json --no-build --configuration Release 2>&1) || true
          echo "Raw migrations output: $MIGRATIONS_JSON"
          MIGRATIONS=$(echo "$MIGRATIONS_JSON" | sed -n '/^\[/,$p')
          COUNT=$(echo "$MIGRATIONS" | jq -r 'length' 2>/dev/null || true)
          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "ERROR: Could not read the migration list from the database" >&2
            exit 1
          fi
          # "0" is EF's marker for "before the first migration".
          FROM=$(echo "$MIGRATIONS" | jq -r '
            (map(.applied) | index(false)) as $i
            | if $i == null then "none" elif $i == 0 then "0" else .[$i - 1].id end')
          echo "Pending migrations start after: $FROM"
          if [ "$FROM" = "none" ]; then
            echo "-- No pending migrations." > migrations.sql
          else
            dotnet tool run dotnet-ef migrations script "$FROM" --project PrintLogApi \
              --output migrations.sql --idempotent --no-build --configuration Release
          fi
        env:
          DB_CONNECTION_STRING_MIGRATIONS_READER: ${{ secrets.DB_CONNECTION_STRING_MIGRATIONS_READER }}

      - name: Upload migration script artifact
        uses: actions/upload-artifact@v7
        with:
          name: migration-script
          path: migrations.sql

      - name: Build migrations bundle
        run: |
          dotnet restore PrintLogApi/PrintLogApi.csproj --runtime linux-x64
          dotnet tool run dotnet-ef migrations bundle --project PrintLogApi --runtime linux-x64 \
            --output ./efbundle

      - name: Upload migrations bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: migrations-bundle
          path: ./efbundle

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Requires manual approval — configure required reviewers in repo Settings → Environments → production
    # Reviewers receive a GitHub notification and can review the migration-script artifact before approving
    environment: production

    steps:
      - name: Download migrations bundle
        uses: actions/download-artifact@v8
        with:
          name: migrations-bundle
          path: ./migrations-bundle

      - name: Download app artifact
        uses: actions/download-artifact@v8
        with:
          name: app
          path: ./publish

      # Command Timeout raises SqlClient's 30s default for the bundle only; the app keeps it.
      # v1.12.0's AddAchievements failed here when CREATE INDEX on Prints ran past 30s. The
      # bundle takes no timeout option, and EF sets one on its commands only when the context is
      # configured with it, so the connection-string keyword is what reaches each migration
      # statement (checked: the bundle logs CommandTimeout='900' for every migration command).
      # Keep it bounded: a migration that ALTERs a table holds its schema lock until commit, so
      # this is also the longest the live app can be blocked on that table.
      - name: Run migrations
        run: |
          chmod +x ./migrations-bundle/efbundle
          ./migrations-bundle/efbundle --connection "$DB_CONNECTION_STRING;Command Timeout=900"
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish

  # Separate job so `contents: write` is scoped to publishing alone, and it runs only
  # after a successful deploy -- the Releases feed should never announce a version that
  # is not actually live.
  #
  # Unlike the UI repo, there is no hand-written per-version prose here to extract, so
  # --generate-notes is the right source: squash-merged PR titles on this repo are
  # descriptive, and an auto-generated changelog beats the nothing that exists today.
  publish-release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # No checkout: `gh release create` acts on the API, and GH_REPO tells it which
      # repository without cloning the tree just to cut a release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  # Publishes server.json to the official MCP Registry (#128; runbook in
  # docs/mcp-registry-listing.md). Off until the owner sets the repository variable
  # MCP_REGISTRY_PUBLISH to 'true', so merging this job changes nothing on its own.
  #
  # After deploy, for the same reason as publish-release: the listing must never describe a
  # server that is not live yet.
  #
  # Auth is DNS, not GitHub OIDC. `login github-oidc` only grants io.github.<owner>/*; the
  # com.3dprintlog namespace is proved by an Ed25519 key whose public half is a TXT record on the
  # 3dprintlog.com apex. That key can publish (and overwrite) anything under com.3dprintlog/*, so
  # it is an environment secret on 'mcp-registry', which the runbook restricts to v* tags and puts
  # behind a required reviewer. No id-token permission: nothing here uses OIDC.
  #
  # Registry versions are immutable, and server.json's version tracks the listing, not the API
  # release. So most releases find their version already published and skip; a release fails only
  # when server.json changed without a version bump, which would otherwise be silently dropped.
  publish-mcp-registry:
    needs: deploy
    if: vars.MCP_REGISTRY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read

    env:
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      # Pinned with its checksum from the release's registry_<version>_checksums.txt. To upgrade,
      # change both from https://github.com/modelcontextprotocol/registry/releases.
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decide whether this version needs publishing
        id: check
        run: |
          NAME=$(jq -r '.name' server.json)
          VERSION=$(jq -r '.version' server.json)
          URL="$REGISTRY_URL/v0.1/servers/${NAME//\//%2F}/versions/$VERSION"
          STATUS=$(curl -sS -o published.json -w '%{http_code}' "$URL")
          case "$STATUS" in
            404)
              echo "$NAME $VERSION is not in the registry yet; publishing."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              if diff <(jq -S '.server' published.json) <(jq -S '.' server.json); then
                echo "$NAME $VERSION is already published and unchanged; nothing to do."
                echo "publish=false" >> "$GITHUB_OUTPUT"
              else
                echo "::error::server.json differs from the published $NAME $VERSION. Registry versions are immutable: bump 'version' in server.json (and MCP_SERVER_VERSION in the UI's scripts/discovery-lib.mjs)."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected HTTP $STATUS from $URL"
              exit 1
              ;;
          esac

      - name: Install mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: |
          ARCHIVE="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${ARCHIVE}"
          echo "${MCP_PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar xzf "$ARCHIVE" mcp-publisher

      - name: Publish to the MCP Registry
        if: steps.check.outputs.publish == 'true'
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the mcp-registry environment."
            exit 1
          fi
          ./mcp-publisher login dns --domain 3dprintlog.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
          ./mcp-publisher logout

      - name: Verify the listing
        if: steps.check.outputs.publish == 'true'
        run: |
          NAME=$(jq -r '.name' server.json)
          VERSION=$(jq -r '.version' server.json)
          curl -fsS "$REGISTRY_URL/v0.1/servers/${NAME//\//%2F}/versions/$VERSION" | jq -e --arg v "$VERSION" '.server.version == $v'
