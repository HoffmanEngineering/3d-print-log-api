name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing in CI writes to the repository, and an explicit
# block replaces whatever the repository-wide default happens to be -- which is a
# setting that can change outside this file.
permissions:
  contents: read

# A newer push to the same ref makes an in-flight run obsolete. This suite runs
# restore, a full format-and-analyzer pass, a build, the EF model check and the test
# suite, so cancelling the superseded run returns a runner instead of racing to a
# result nobody reads.
#
# Keyed on the PR number when there is one, so a push to a branch and the pull_request
# run for that same branch do not cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Installs exactly the SDK global.json asks for, so the root global.json is the single source
      # of truth rather than something CI can disagree with. This matters for the format gate below:
      # it runs the style and analyzer passes, which are implemented by the SDK's bundled analyzers,
      # so a floating 'dotnet-version: 10.x' could turn that gate red on a PR that changed nothing.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      # Fails on any file whose line endings, UTF-8 BOM, whitespace, using order or analyzer-fixable
      # diagnostics drift from .editorconfig. Reproduce a failure locally with `dotnet format` and
      # commit the result.
      #
      # This is the enforced half of the encoding policy. .gitattributes covers line endings at the
      # Git layer, but Git has no concept of a BOM, so `charset = utf-8-bom` is only real if
      # something applies it -- this step is that something.
      #
      # Full `dotnet format`, i.e. all three of whitespace, style and analyzers. The scope was
      # widened once the codebase actually satisfied the latter two (29 files); leaving a rule
      # declared in .editorconfig but unenforced is what let `charset = utf-8-bom` sit true on paper
      # and false in 233 files.
      #
      # Unlike the other steps this one needs the analyzers, so it cannot use --no-restore and it
      # runs after restore rather than first.
      #
      # CA2017 is carved out because it has no automatic code fix -- `dotnet format` reports it and
      # then cannot resolve it, so the gate would be permanently red. The ten offending logger calls
      # are tracked in #60. Remove this exclusion when #60 closes, or the rule stays unenforced.
      - name: Verify formatting and encoding
        run: dotnet format --verify-no-changes --verbosity diagnostic --exclude-diagnostics CA2017

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Runs before the tests: this takes seconds, and a model/migration mismatch is a definitive
      # blocker, so there is no value in waiting out the suite to hear about it.
      #
      # Guards the nullable reference type migration (see #46). Enabling nullable annotations
      # changes how EF Core infers required/optional columns, and a careless annotation can
      # silently make a nullable column NOT NULL -- which does not fail the build, it fails the
      # migration against production data. Useful beyond that migration too: the deploy pipeline
      # applies migrations to production, so any unmigrated model change belongs here.
      #
      # dotnet-ef is pinned in dotnet-tools.json to the same version as the EF Core packages.
      - name: Restore tools
        run: dotnet tool restore

      - name: Verify EF model matches migrations
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project PrintLogApi --no-build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
