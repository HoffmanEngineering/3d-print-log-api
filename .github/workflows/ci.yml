name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Guards the nullable reference type migration (see #46). Enabling nullable annotations
      # changes how EF Core infers required/optional columns, and a careless annotation can
      # silently make a nullable column NOT NULL -- which only shows up as a failed migration
      # against production data. This fails the build instead, on any unmigrated model change.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.6

      - name: Verify EF model matches migrations
        run: dotnet ef migrations has-pending-model-changes --project PrintLogApi --no-build --configuration Release
