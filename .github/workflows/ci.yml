name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      # Fails on any file whose line endings, UTF-8 BOM or whitespace drift from .editorconfig.
      # Runs before the build because it takes seconds and needs no compilation.
      #
      # This is the enforced half of the encoding policy. .gitattributes covers line endings at the
      # Git layer, but Git has no concept of a BOM, so `charset = utf-8-bom` is only real if
      # something applies it -- this step is that something. Reproduce a failure locally with
      # `dotnet format whitespace` and commit the result.
      #
      # Scoped to `whitespace` deliberately: the full `dotnet format` would also enforce the style
      # and analyzer rules in .editorconfig, which this codebase does not currently satisfy.
      - name: Verify formatting and encoding
        run: dotnet format whitespace --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Runs before the tests: this takes seconds, and a model/migration mismatch is a definitive
      # blocker, so there is no value in waiting out the suite to hear about it.
      #
      # Guards the nullable reference type migration (see #46). Enabling nullable annotations
      # changes how EF Core infers required/optional columns, and a careless annotation can
      # silently make a nullable column NOT NULL -- which does not fail the build, it fails the
      # migration against production data. Useful beyond that migration too: the deploy pipeline
      # applies migrations to production, so any unmigrated model change belongs here.
      #
      # dotnet-ef is pinned in dotnet-tools.json to the same version as the EF Core packages.
      - name: Restore tools
        run: dotnet tool restore

      - name: Verify EF model matches migrations
        run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project PrintLogApi --no-build --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
